<h1 align="left">MO_GetIFrameInfo</h1>
<h2>構文</h2>
<dl>
  <dd>
  	<CODE>#include &lt;nitro/Mobiclip.h&gt;</CODE><br><br>
		<CODE>u32         MO_GetIFrameInfo            ( <a href="MO_Types.html"><code>MOHandle</code></a> handle, u32 index );</code>
  </dd>
</dl>

<h2>説明</h2>
<P>
<strong>index</strong>でインデックス付けされたI-Frame（キーフレーム）のフレーム番号を取得します。
</P>

<h2>引数</h2>
<table border="1">
  <TBODY>
	  <tr>
	    <TD><B><I>handle</I></B></TD>
	    <td>有効なムービーのハンドル。</td>
	  </tr>	
	  <tr>
	    <TD><B><I>index</I></B></TD>
	    <td>フレーム番号を取得したいI-Frameのインデックス。</td>
	  </tr>
	</TBODY>	  
</table>

<h2>返り値</h2>
<p><strong>index</strong>でインデックス付けされたI-Frameのフレーム番号。</p>

<P>
<a href="MO_GetNbIFrame.html"><code>MO_GetNbIFrame</code></a>
</P>
