<h1 align="left">MO_CloseMovie</h1>
<h2>構文</h2>
<dl>
  <dd>
  	<CODE>#include &lt;nitro/Mobiclip.h&gt;</CODE><BR><BR>
		<CODE>void        MO_CloseMovie               ( <a href="MO_Types.html">MOHandle</a> handle );</code>		
  </dd>
</dl>

<h2>説明</h2>
<p>
Mobiclip ムービーを閉じます。<br>
<a href="MO_MallocFree.html"><code>MO_Free</code></a> がこの関数内で呼び出されます。
</p>

<h2>引数</h2>
<table border="1">
	<TBODY>
  	<tr>
	    <TD><B><I>handle</I></B></TD>
	    <td>有効なムービーのハンドル。 <a href="MO_Types.html"><code>MO_INVALID_HANDLE</code></a> の場合、関数は何もしません。</td>
	  </tr>
	</TBODY>
</table>

<h2>返り値</h2>
<p>なし。</p>
