<h1 align="left">MO_GetOptimalDTCMSize</h1>
<h2>構文</h2>
<dl>
  <dd>
  	<CODE>#include &lt;nitro/Mobiclip.h&gt;</CODE><br><br>
		<CODE>u32         MO_GetOptimalDTCMSize               ( void );</code>
  </dd>
</dl>

<h2>説明</h2>
<P>
最適な再生パフォーマンスを実行するのにMobiclipが必要とするデータTCMをバイト単位で読み出します。<br>
この機能はコードの再配置を管理するために使用されます。<br>
</P>

<h2>引数</h2>
<table border="1">
	<body>
	  <tr>
	    <td>なし。</td>
	  </tr>
	</body>	 
</table>

<h2>返り値</h2>
<p>
必要とするデータTCMのサイズをバイト単位で返します。
</p>
