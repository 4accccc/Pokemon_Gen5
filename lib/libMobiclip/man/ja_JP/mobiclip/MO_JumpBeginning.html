<h1 align="left">MO_JumpBeginning</h1>
<h2>構文</h2>
<dl>
  <dd>
  	<CODE>#include &lt;nitro/Mobiclip.h&gt;</CODE><br><br>
		<CODE>u32         MO_JumpBeginning        ( <a href="MO_Types.html"><code>MOHandle</code></a> handle );</code>
  </dd>
</dl>

<h2>説明</h2>
<P>
ムービーの先頭に移動します。
</P>

<h2>引数</h2>
<table border="1">
  <TBODY>
	  <tr>
	    <TD><B><I>handle</I></B></TD>
	    <td>有効なムービーのハンドル。</td>
	  </tr>
	</TBODY>
</table>

<h2>返り値</h2>
<p>エラーがない場合は"1"、エラーが起こったか、もしくはハンドルが <a href="MO_Types.html"><code>MO_INVALID_HANDLE</code></a> の場合は"0"。</p>
